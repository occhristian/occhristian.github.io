---
layout: default
---
<section class="page-hero narrow">
  <p class="eyebrow">{{ page.eyebrow | default: site.tagline }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
</section>
<section class="content narrow">
  {{ content }}
</section>
