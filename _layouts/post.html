---
layout: default
---
<article class="post narrow">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← Back to blog</a>
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="tag-row">
      {% for tag in page.tags limit: 8 %}<span>{{ tag }}</span>{% endfor %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
